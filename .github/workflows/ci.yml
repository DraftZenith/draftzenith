name: CI

on:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    name: Type check, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        run: bun run check

      - name: Validate Cloudflare Worker package
        run: npx --yes --package=wrangler@4.160.0 wrangler deploy --dry-run

      - name: Smoke test local Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=wrangler@4.160.0 wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/draftzenith-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          home_status=""
          for attempt in $(seq 1 30); do
            home_status="$(curl --silent --show-error --output /tmp/draftzenith-home.html --write-out '%{http_code}' http://127.0.0.1:8787/ 2>/dev/null || true)"
            if [[ "$home_status" == "200" ]]; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/draftzenith-wrangler.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$home_status" != "200" ]]; then
            cat /tmp/draftzenith-wrangler.log
            echo "Homepage returned HTTP ${home_status:-no response}"
            head -c 2000 /tmp/draftzenith-home.html 2>/dev/null || true
            exit 1
          fi

          grep -qi "Draft Zenith" /tmp/draftzenith-home.html

          # Exercise every public route that the sitemap advertises, including
          # the assessment form, so broken route registration fails CI.
          for route in about services portfolio how-it-works get-started; do
            route_status="$(curl --silent --show-error --output "/tmp/draftzenith-${route}.html" --write-out '%{http_code}' "http://127.0.0.1:8787/${route}")"
            if [[ "$route_status" != "200" ]]; then
              cat /tmp/draftzenith-wrangler.log
              echo "/${route} returned HTTP $route_status"
              head -c 2000 "/tmp/draftzenith-${route}.html" 2>/dev/null || true
              exit 1
            fi
          done

          grep -qi "Request a Free Assessment" /tmp/draftzenith-get-started.html

          sitemap_status="$(curl --silent --show-error --output /tmp/draftzenith-sitemap.xml --write-out '%{http_code}' http://127.0.0.1:8787/sitemap.xml)"
          if [[ "$sitemap_status" != "200" ]] || ! grep -q "<urlset" /tmp/draftzenith-sitemap.xml; then
            cat /tmp/draftzenith-wrangler.log
            echo "Sitemap returned HTTP $sitemap_status"
            head -c 2000 /tmp/draftzenith-sitemap.xml 2>/dev/null || true
            exit 1
          fi

          robots_status="$(curl --silent --show-error --output /tmp/draftzenith-robots.txt --write-out '%{http_code}' http://127.0.0.1:8787/robots.txt)"
          if [[ "$robots_status" != "200" ]] || ! grep -Fxq "Sitemap: http://127.0.0.1:8787/sitemap.xml" /tmp/draftzenith-robots.txt; then
            cat /tmp/draftzenith-wrangler.log
            echo "robots.txt returned HTTP $robots_status or did not advertise the request-origin sitemap"
            cat /tmp/draftzenith-robots.txt 2>/dev/null || true
            exit 1
          fi
