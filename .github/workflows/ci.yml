name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Type check, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        run: bun run check

      - name: Validate Cloudflare Worker package
        run: bunx --bun wrangler deploy --dry-run

      - name: Smoke test local Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          bunx --bun wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/draftzenith-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ -o /tmp/draftzenith-home.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/draftzenith-home.html
          grep -qi "Draft Zenith" /tmp/draftzenith-home.html
          curl --fail --silent http://127.0.0.1:8787/sitemap.xml | grep -q "<urlset"
