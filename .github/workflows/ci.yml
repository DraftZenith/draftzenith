name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Type check, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        run: bun run check

      - name: Validate Cloudflare Worker package
        run: npx --yes wrangler deploy --dry-run

      - name: Smoke test local Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/draftzenith-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          home_status=""
          for attempt in $(seq 1 30); do
            home_status="$(curl --silent --show-error --output /tmp/draftzenith-home.html --write-out '%{http_code}' http://127.0.0.1:8787/ 2>/dev/null || true)"
            if [[ "$home_status" == "200" ]]; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/draftzenith-wrangler.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$home_status" != "200" ]]; then
            cat /tmp/draftzenith-wrangler.log
            echo "Homepage returned HTTP ${home_status:-no response}"
            head -c 2000 /tmp/draftzenith-home.html 2>/dev/null || true
            exit 1
          fi

          grep -qi "Draft Zenith" /tmp/draftzenith-home.html
          sitemap_status="$(curl --silent --show-error --output /tmp/draftzenith-sitemap.xml --write-out '%{http_code}' http://127.0.0.1:8787/sitemap.xml)"
          if [[ "$sitemap_status" != "200" ]] || ! grep -q "<urlset" /tmp/draftzenith-sitemap.xml; then
            cat /tmp/draftzenith-wrangler.log
            echo "Sitemap returned HTTP $sitemap_status"
            head -c 2000 /tmp/draftzenith-sitemap.xml 2>/dev/null || true
            exit 1
          fi
